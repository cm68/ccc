name: Build

on:
  push:
    branches: [ master ]
    tags:
      - '*'
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    # Baseline for the clobber check at the end of the run.  Taken
    # before anything is built, so the comparison is against a tree
    # as checked out rather than against an assumption about what a
    # checkout contains.
    - name: Record clean tree
      run: git status --porcelain --ignored=matching > /tmp/tree-before.txt

    # gcc-multilib for -m32: the host passes are built 32-bit so that
    # long is 32 bits here as it is on the Z80.  Nothing else is
    # needed - the compiler, the assembler, the linker and the
    # librarian are all in this tree.
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc gcc-multilib make gawk

    # make builds the host side, installs it into desthost/, then
    # builds the z80 runtime with it into destmicronix/.  Both phases
    # in one target - see src/GNUmakefile for why the order is forced.
    # destcpm/ is not built: CP/M is tabled, pruned at TARGETDIRS.
    - name: Build
      run: make

    - name: Run tests
      run: make test

    # The other half of the test suite: sources that must NOT compile.
    # A diagnostic that stops firing is a silent regression - the
    # compiler goes on accepting what it used to refuse - and "make
    # test" cannot see it, because every source in that list is one
    # that succeeds.  No simulator involved: each of these is ccc
    # invoked once and required to fail.
    - name: Run tests expected to fail
      run: make -C tests test-fail

    # Every generated program must still reduce to code.  This is what
    # catches a rule that stops matching: the compile succeeds, the
    # output is short an expression, and pass2 marks the gap with
    # XXXXXX rather than emitting anything.  Also simulator-free - it
    # compiles and greps, and never runs what it built.
    - name: Check every production still reduces
      run: make -C tests/gen complete

    - name: Show build artifacts
      run: |
        ls -lh desthost/bin desthost/lib destmicronix/lib
        file desthost/lib/pass0 desthost/lib/c0 desthost/lib/c1 desthost/lib/peep

    # The invariant that clobber removes what a build makes: after it,
    # the tree must look the way it did on checkout.  The install
    # trees go too - unlike the old root/, they hold nothing but what
    # a build put there.
    - name: Check that clobber leaves nothing behind
      run: |
        make clobber
        git status --porcelain --ignored=matching > /tmp/tree-after.txt
        if ! diff -u /tmp/tree-before.txt /tmp/tree-after.txt; then
          echo "clobber left the files marked + above"
          exit 1
        fi
        echo "clobber is clean"

    - name: Package the toolchain
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        make
        tar czf ccc-${{ github.ref_name }}.tar.gz unix micronix cpm

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ccc-${{ github.ref_name }}.tar.gz
        body: |
          ccc toolchain for ${{ github.ref_name }}

          The built compiler (cpp, c0, c1, peep), the Whitesmith's
          tools (asz, ld, wslib, nm, size), the ccc driver and
          the Z80 runtime archives.
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
